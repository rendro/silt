name: Fuzz (nightly deep)

# Discovery-mode fuzzing: runs real libfuzzer mutation against every
# target for a meaningful length of time, on a schedule instead of
# per-push. Per-push fuzz runs at 60s each are both too slow to find
# deep bugs and too flaky to gate merges (each run explores different
# inputs and blocks merges on whichever random bug it happens to
# hit). Keep PR CI fast and deterministic via the corpus-replay job
# in ci.yml; do real discovery here.
#
# When a crash fires, the crash file is uploaded for triage and the
# job fails. A crash that needs permanent regression coverage should
# be copied into fuzz/corpus/<target>/ so the ci.yml corpus-replay
# gate picks it up on every subsequent push.
#
# The `oracle` job is the full sweep of the differential oracle
# (tests/oracle): every input of every class, where the per-push suite
# runs a sample. A failure of it fails the run: the sweep is
# deterministic, and what it reports is a finding that has no line in
# tests/oracle/skip.txt, or a line whose finding is gone.
#
# A failed job of a scheduled run opens a GitHub issue, "nightly: <job>
# failed" (the `report` job), and a release is refused while the newest
# finished run of this workflow on main is not green (release.yml).

on:
  schedule:
    # Daily at 06:00 UTC.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      seconds_per_target:
        description: 'Seconds of fuzz mutation per target (the job stops after 60 minutes, its build included)'
        required: false
        default: '900'

# The token of every job reads the repository and nothing else.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }} (${{ github.event.inputs.seconds_per_target || 900 }}s)
    runs-on: ubuntu-latest
    # The build and the default 900 seconds take about 20 minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_lexer
          - fuzz_parser
          - fuzz_formatter
          - fuzz_roundtrip
          - fuzz_typechecker
          - fuzz_compiler
          - fuzz_http_request
          - fuzz_run
          - fuzz_decode
          - fuzz_package_files
          - fuzz_csv
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            fuzz

      - name: Install cargo-fuzz
        # See ci.yml `fuzz-corpus` for the rationale on dropping
        # `--locked`: cargo-fuzz's published Cargo.lock pins a rustix
        # release that no longer compiles on current nightly.
        run: cargo install cargo-fuzz

      - name: Seed corpus
        run: ./fuzz/seed.sh

      # Discovery-mode: a crash here is a *finding*. It fails the job,
      # after the steps below have saved the crash file and said where
      # it is. Triage by copying the crash into fuzz/corpus/<target>/
      # so the regression gate (`fuzz-corpus` in ci.yml) locks it.
      - name: Fuzz ${{ matrix.target }}
        id: fuzz
        run: |
          secs=${{ github.event.inputs.seconds_per_target || 900 }}
          cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=$secs

      - name: Upload reproducers if any
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-nightly-${{ matrix.target }}
          path: |
            fuzz/artifacts/**
            fuzz/crash-*
            fuzz/leak-*
            fuzz/timeout-*
            fuzz/oom-*
          retention-days: 30
          if-no-files-found: ignore

      - name: Annotate new crash
        if: failure() && steps.fuzz.outcome == 'failure'
        run: |
          echo "::error title=New fuzz finding::Target ${{ matrix.target }} failed in this run; its crash file, if it wrote one, is in the artifact fuzz-nightly-${{ matrix.target }}. Add the repro to fuzz/corpus/${{ matrix.target }}/ to lock it as a regression test."

  oracle:
    name: Differential oracle (full sweep)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-heavy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest

      # A debug build, as the per-push suite: a walk of a deep value
      # that used the native stack would overflow it first in one.
      - name: cargo nextest (oracle, every input)
        env:
          SILT_ORACLE_FULL: "1"
          SILT_ORACLE_REPORT: oracle-report.txt
        run: cargo nextest run --locked --no-fail-fast --all-features --test oracle

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-report
          path: oracle-report.txt
          retention-days: 30
          if-no-files-found: ignore

  # Each failed job of a scheduled run opens one issue, "nightly: <job>
  # failed", or adds the run to it while it is open. A run started by
  # hand is watched by whoever started it, and a fork's scheduled runs
  # are its own business: neither reports.
  report:
    name: Report failed jobs
    needs: [fuzz, oracle]
    if: ${{ !cancelled() && github.event_name == 'schedule' && github.repository == 'rendro/silt' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job that may write: issues, nothing else.
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Open or update an issue for each failed job
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/report-failed-jobs.sh nightly
