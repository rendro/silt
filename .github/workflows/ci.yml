name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request replaces the run of the push before it, so
# feedback comes from the latest commit and stale runs do not queue up.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --all-features

      # The default feature set is what `cargo install silt` builds; check
      # and lint it too, so code behind a non-default feature cannot hide
      # a break in the default build.
      - name: cargo check (default features)
        run: cargo check

      - name: cargo clippy (default features)
        run: cargo clippy -- -D warnings

      - name: cargo check --benches
        run: cargo check --benches --all-features

      - name: cargo clippy
        run: cargo clippy --all-features -- -D warnings

      - name: cargo fmt
        run: cargo fmt -- --check

  test-linux:
    # Split Linux test runs across 4 parallel matrix partitions so total
    # wall-clock approximates max(slowest partition) instead of the sum.
    # The partitions follow the suite binaries under tests/ (see
    # .github/scripts/run-test-partition.sh): the `heavy` suite, the
    # `concurrency` suite, and everything else split in two by nextest's
    # hash partitioning. A new test needs no change here.
    name: Test Linux (${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        partition: [heavy, concurrency, rest1, rest2, rest3]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Different test sets pull different code paths into the
          # binaries — avoid the partitions stomping each other's caches.
          shared-key: test-${{ matrix.partition }}

      # cargo-nextest runs test binaries in PARALLEL (cargo test serializes them).
      # On the `rest` partition with 215 binaries, this is the difference between
      # 16-min wall clock (cargo test) and ~3-min wall clock (nextest).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: cargo nextest (${{ matrix.partition }})
        run: |
          CI=1 perl -e 'alarm 1500; exec @ARGV or die "exec: $!"' \
            bash .github/scripts/run-test-partition.sh ${{ matrix.partition }}

  test-default-features:
    # Everything else runs with --all-features. This job runs the unit
    # tests and the golden corpus against the default build; golden cases
    # that need an optional feature declare `-- requires-feature:` and
    # are skipped here.
    name: Test default features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-default-features
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: cargo nextest (default features)
        run: |
          CI=1 perl -e 'alarm 1680; exec @ARGV or die "exec: $!"' \
            cargo nextest run --no-fail-fast --lib --bin silt --test golden

  test-release-deep-values:
    # The tests whose limits depend on native stack frames in a release
    # build (deep value comparison, ordering and hashing); they are
    # ignored in the debug builds every other job runs.
    name: Test release (deep values)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-release
      - name: cargo test --release (deep values)
        run: cargo test --release --all-features --test lang deep_value_stack_tests

  test-macos:
    name: Test macOS (${{ matrix.partition }})
    runs-on: macos-latest
    # Partitioned like Linux and Windows. Unpartitioned, the whole suite
    # took 33 of its 35 minutes on main and outgrew the cap in wave 1
    # of the 2026-09-27 fix plan (killed at 5885/6082 with zero
    # failures). The inner perl alarm must stay shorter than the job
    # timeout so nextest is killed with output rather than by the runner.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        partition: [heavy, concurrency, rest1, rest2, rest3]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-macos-${{ matrix.partition }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: cargo nextest (${{ matrix.partition }})
        run: |
          CI=1 perl -e 'alarm 1800; exec @ARGV or die "exec: $!"' \
            bash .github/scripts/run-test-partition.sh ${{ matrix.partition }}

  # Windows runners are 3-5× slower than Linux/macOS at file I/O and
  # process spawning, so a single-job sweep of 3800+ tests pushes past
  # the 25-min cap. Partition the same way Linux does so total wall-
  # clock is max(slowest partition) instead of the sum. The `rest` bucket
  # alone outgrew the 30-min in-script cap as the suite kept growing, so
  # it is split into rest1/rest2 (~15 min each, headroom for growth).
  test-windows:
    name: Test Windows (${{ matrix.partition }})
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        partition: [heavy, concurrency, rest1, rest2, rest3]
    steps:
      - name: Configure git for LF on Windows
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-windows-${{ matrix.partition }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: cargo nextest (${{ matrix.partition }})
        shell: pwsh
        run: |
          $env:CI = "1"
          # The verdict shards start four processes per case; Windows is
          # too slow at that for its cap, and verdicts are platform-independent.
          $env:SILT_GOLDEN_SKIP_VERDICT = "1"
          $process = Start-Process -FilePath "bash" `
            -ArgumentList ".github/scripts/run-test-partition.sh","${{ matrix.partition }}" `
            -NoNewWindow -PassThru
          # Round-79 follow-up: the `rest` partition was bumping the
          # 25-min cap because Windows runners are 3-5× slower than
          # Linux/macOS at file I/O. Bumped to 30 min (with the
          # job-level timeout-minutes also raised to 35 for headroom).
          $finished = $process.WaitForExit(30*60*1000)
          if (-not $finished) {
            $process.Kill()
            Write-Error "cargo nextest exceeded 30-minute wall-clock cap"
            exit 124
          }
          exit $process.ExitCode

  fuzz-corpus:
    name: Fuzz corpus replay
    runs-on: ubuntu-latest
    # Deterministic regression gate: replays every committed file
    # under fuzz/corpus/<target>/ through each fuzz target exactly
    # once, with NO mutation. Catches regressions on bugs we have
    # previously found without blocking merges on stochastic new
    # discoveries. Discovery-mode fuzzing lives in fuzz-nightly.yml
    # and `fuzz/local.sh`; see fuzz/README.md for the workflow.
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust nightly (required by cargo-fuzz)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz

      - name: Install cargo-fuzz
        # `--locked` would honour cargo-fuzz's published Cargo.lock,
        # which pins an older rustix release (<0.38) that uses
        # perma-unstable `rustc_layout_scalar_valid_range_*`
        # attributes. Recent nightlies (~2026-05) reject those
        # attributes outside the rustc compiler itself, so the locked
        # install fails. Drop `--locked` so cargo resolves fresh
        # semver-compatible versions and pulls in a newer rustix that
        # compiles on current nightly. We accept the small
        # reproducibility hit because the alternative is keeping the
        # corpus-replay gate red indefinitely.
        run: cargo install cargo-fuzz

      - name: Seed corpus
        run: ./fuzz/seed.sh

      - name: Replay fuzz_lexer corpus
        run: ./fuzz/replay.sh fuzz_lexer

      - name: Replay fuzz_parser corpus
        run: ./fuzz/replay.sh fuzz_parser

      - name: Replay fuzz_formatter corpus
        run: ./fuzz/replay.sh fuzz_formatter

      - name: Replay fuzz_roundtrip corpus
        run: ./fuzz/replay.sh fuzz_roundtrip

      - name: Replay fuzz_typechecker corpus
        run: ./fuzz/replay.sh fuzz_typechecker

      - name: Replay fuzz_compiler corpus
        run: ./fuzz/replay.sh fuzz_compiler

      - name: Upload reproducers on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-reproducers
          path: |
            fuzz/artifacts/**
            fuzz/crash-*
            fuzz/leak-*
            fuzz/timeout-*
            fuzz/oom-*
          retention-days: 14
          if-no-files-found: ignore
