name: Release

# A release in one step: Actions -> Release -> "Run workflow" with the
# version (or `gh workflow run release.yml -f version=0.17.1`). The
# workflow checks that main is green and the version is new, writes the
# version into Cargo.toml and Cargo.lock, commits it to main, tags it,
# builds every target and the playground, makes the GitHub release, and
# moves the website's silt submodule to the tag.
#
# Pushing a tag `vX.Y.Z` by hand still releases that tag as before
# (no bump, no commit).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, for example 0.17.1"
        required: true
        type: string

# The token reads the repository; each job that must do more says so.
# Only the job that pushes the version commit and tag, and the one that
# makes the release, may write: the build jobs, which run third-party
# actions and the build, hold a read-only token.
permissions:
  contents: read

# Two releases never run at once.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Version and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # It pushes the version commit and the tag, and reads CI's runs.
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # A tag pushed by hand is released as it is.
      - name: The pushed tag
        if: github.event_name == 'push'
        run: echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Check the version and main
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$GITHUB_REF" = refs/heads/main ] || fail "Run the release from main, not $GITHUB_REF."
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "\"$VERSION\" is not a version like 0.17.1."
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ "$VERSION" != "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)" = "$VERSION" ] \
            || fail "$VERSION is not higher than the current version $current."
          [ -z "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ] || fail "The tag v$VERSION exists already."
          sha=$(git rev-parse HEAD)
          ci=$(gh run list --workflow ci.yml --branch main --commit "$sha" --event push --limit 1 --json status,conclusion \
            --jq '.[0] | "\(.status) \(.conclusion)"')
          [ "$ci" = "completed success" ] \
            || fail "CI on main ($sha) is \"${ci:-not run}\", not green: wait for it, or fix main first."
          echo "Releasing $current -> $VERSION from $sha"

      - name: Write the version, commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          # The package's own version: the first `version =` line of
          # Cargo.toml, and silt's entry in Cargo.lock.
          sed -i "0,/^version = \"$current\"$/s//version = \"$VERSION\"/" Cargo.toml
          perl -0pi -e "s/name = \"silt\"\nversion = \"\Q$current\E\"/name = \"silt\"\nversion = \"$VERSION\"/" Cargo.lock
          [ "$(git diff --numstat | wc -l)" = 2 ] || { git diff; echo "::error::The version was not written to exactly Cargo.toml and Cargo.lock."; exit 1; }
          cargo metadata --locked --format-version 1 > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Version $VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_ENV"

      - name: Tag
        id: tag
        run: echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            bin: silt
          # A native ARM runner: under `cross` this target took 11 minutes,
          # every other one about 2.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
            bin: silt
          # Built on an ARM runner; its smoke run goes through Rosetta.
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            bin: silt
            runner: arch -x86_64
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
            bin: silt
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            bin: silt.exe
    env:
      TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      # The binary that is packaged runs before it is published: its
      # version is the tag's, and a program with a task, a channel, a
      # map and json prints what it should.
      - name: Smoke run
        shell: bash
        run: |
          bash .github/scripts/smoke/run.sh \
            "$PWD/target/${{ matrix.target }}/release/${{ matrix.bin }}" "${TAG#v}" ${{ matrix.runner }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../silt-$TAG-${{ matrix.target }}.tar.gz silt
          cd ../../..

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../silt-$TAG-${{ matrix.target }}.zip silt.exe
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silt-${{ matrix.target }}
          path: silt-${{ needs.prepare.outputs.tag }}-${{ matrix.target }}.*

  playground:
    # The playground of silt-lang.com (playground/): the wasm module and
    # its JavaScript, which the site's build takes from the release.
    name: Build the playground
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-pack

      - name: Build
        run: bash playground/build.sh

      - name: Run it under Node
        run: node playground/tests/wasm.mjs playground/pkg

      - name: Package
        run: tar czf silt-$TAG-playground.tar.gz -C playground/pkg .

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silt-playground
          path: silt-${{ needs.prepare.outputs.tag }}-playground.tar.gz

  release:
    name: Create Release
    needs: [prepare, build, playground]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The attestation is signed with the run's OIDC token and stored
    # with the repository. (The artifacts are this run's own: their
    # download needs no `actions: read`.)
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      # Generate a single SHA256SUMS file covering every archive. install.sh
      # and `silt update` both fetch this alongside the binary and refuse to
      # install when the hash doesn't match — the first line of defence
      # against a corrupted or swapped release asset.
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum silt-$TAG-*.tar.gz silt-$TAG-*.zip > silt-$TAG-SHA256SUMS
          cat silt-$TAG-SHA256SUMS

      # A signed statement for every archive that this workflow run, at
      # this commit, built it: `gh attestation verify <archive> --repo
      # rendro/silt` checks one.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/silt-*.tar.gz
            artifacts/silt-*.zip

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*

  website:
    # silt-lang.com (rendro/silt-website) is built from the silt release
    # its `silt/` submodule is pinned to; Vercel deploys each push.
    name: Move the website to the release
    needs: [prepare, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
    steps:
      - name: Without a token the website stays where it is
        if: env.SITE_TOKEN == ''
        run: echo "::warning::The secret SITE_TOKEN is not set, so the website still shows the previous release. Move its silt submodule to $TAG by hand."

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: env.SITE_TOKEN != ''
        with:
          repository: rendro/silt-website
          token: ${{ secrets.SITE_TOKEN }}
          path: site

      - name: Move the submodule to the tag, commit and push
        if: env.SITE_TOKEN != ''
        working-directory: site
        run: |
          set -euo pipefail
          git submodule update --init silt
          git -C silt fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG"
          git -C silt checkout --quiet "$TAG"
          git add silt
          if git diff --cached --quiet; then echo "The website is at $TAG already."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "silt ${TAG#v}"
          git push origin HEAD
