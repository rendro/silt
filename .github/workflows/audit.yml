name: Audit

# Once a week, the lock files (the root's, and those of the playground,
# from which the released module is built, and of the fuzz crate) are
# checked against the RustSec advisory database (https://rustsec.org). The run fails when a dependency has a
# known vulnerability; the warnings (unmaintained, unsound, yanked) are
# printed and do not fail it. A failed scheduled run opens a GitHub
# issue (the `report` job), and a release is refused while the newest
# finished run of this workflow on main is not green (release.yml).

on:
  schedule:
    # Mondays at 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit

      - name: cargo audit
        run: |
          set -euo pipefail
          cargo audit
          cargo audit --file playground/Cargo.lock
          cargo audit --file fuzz/Cargo.lock

  # A failed scheduled run opens one issue, "weekly: cargo audit failed",
  # or adds the run to it while it is open (see fuzz-nightly.yml).
  report:
    name: Report failed jobs
    needs: [audit]
    if: ${{ !cancelled() && github.event_name == 'schedule' && github.repository == 'rendro/silt' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job that may write: issues, nothing else.
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Open or update an issue for each failed job
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/report-failed-jobs.sh weekly
