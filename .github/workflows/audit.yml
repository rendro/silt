name: Audit

# Once a week, Cargo.lock is checked against the RustSec advisory
# database (https://rustsec.org). The run fails when a dependency has a
# known vulnerability; the warnings (unmaintained, unsound, yanked) are
# printed and do not fail it.

on:
  schedule:
    # Mondays at 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        run: cargo audit
