# nextest configuration (CI runs the tests with cargo-nextest).
#
# The `concurrency` suite's tests spawn scheduler threads and assert on
# deadlock verdicts and timeouts. Running all of them at once oversubscribes
# the CPU and turns their timing budgets into false failures, so they run in
# a group with a bounded number of threads.

[test-groups]
concurrency = { max-threads = 4 }
timing = { max-threads = 1 }
database = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(=concurrency)'
test-group = 'concurrency'

# The tests of the `heavy` suite that measure time, or whose run time is
# what they show: the checker's scaling ratios (tests/heavy/checker_scaling.rs),
# the lexer's (tests/heavy/lexer_scaling.rs), the running program's
# (tests/heavy/runtime_scaling.rs), a pasted REPL entry
# (tests/heavy/repl_paste.rs), the language server's answer times
# (tests/heavy/lsp_workspace_perf.rs) and the formatter's 16,000 lines.
# Each runs alone: one at a time among themselves (the group), and with
# no other test beside it (it needs every test thread), so the sweeps of
# the same binary, which keep every core busy for a minute, are not what
# it measures. (This override stands before the `fmt_property` one: the
# first that matches a test decides a setting.)
[[profile.default.overrides]]
filter = 'binary(=heavy) & (test(/^checker_scaling::/) | test(/^lexer_scaling::/) | test(/^runtime_scaling::/) | test(/^repl_paste::/) | test(/^lsp_workspace_perf::/) | test(=fmt_property_sweep_tests::sixteen_thousand_lines_are_formatted))'
test-group = 'timing'
threads-required = 'num-test-threads'

# The count of how many requests other connections are served before a
# queued task runs (tests/lang/http_server_tests.rs) depends on how the
# system shares the cores among the test processes too: run alone on a
# 3-core macOS runner it stayed at 434-1,519 of the 2,560 it allows in
# 80 runs, with mimalloc and without; beside the rest of its shard it
# reached 2,726, 2,970 and 4,795. It runs alone, as the timing tests do.
[[profile.default.overrides]]
filter = 'test(=http_server_tests::a_connection_gives_way_after_a_few_requests)'
test-group = 'timing'
threads-required = 'num-test-threads'

# The formatter's property runs (tests/frontend/fmt_property/mod.rs)
# format thousands of inputs on two threads each.
[[profile.default.overrides]]
filter = 'test(fmt_property)'
threads-required = 2

# Two tests of the step budget (tests/oracle/limits.rs) count on a task
# using its budget up while `main` sleeps or waits: with every core busy
# beside them they failed in full oracle runs, and passed alone, on main
# too. They run alone, as the timing tests do. (This override stands
# before the oracle's: the first that matches a test decides a setting.)
[[profile.default.overrides]]
filter = 'binary(=oracle) & (test(=limits::the_budget_ends_the_tasks_of_a_program_too) | test(=limits::a_fault_of_the_program_is_not_the_budgets))'
test-group = 'timing'
threads-required = 'num-test-threads'

# The differential oracle (tests/oracle) checks and runs its programs on
# two threads, and a program with tasks starts the scheduler's workers.
[[profile.default.overrides]]
filter = 'binary(=oracle)'
threads-required = 2

# The `database` suite (tests/database) runs its programs against one
# PostgreSQL server: one case at a time, so that no case sees another's
# sessions. A case that is skipped because no server is named says so on
# stderr, which nextest shows only when told to.
[[profile.default.overrides]]
filter = 'binary(=database)'
test-group = 'database'
success-output = 'immediate'
