# nextest configuration (CI runs the tests with cargo-nextest).
#
# The `concurrency` suite's tests spawn scheduler threads and assert on
# deadlock verdicts and timeouts. Running all of them at once oversubscribes
# the CPU and turns their timing budgets into false failures, so they run in
# a group with a bounded number of threads.

[test-groups]
concurrency = { max-threads = 4 }
timing = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(=concurrency)'
test-group = 'concurrency'

# The tests of the `heavy` suite that compare measured times: the
# lexer's scaling ratios (tests/heavy/lexer_scaling.rs), a pasted REPL
# entry (tests/heavy/repl_paste.rs) and the language server's answer
# times (tests/heavy/lsp_workspace_perf.rs). Each runs alone: one at a
# time among themselves (the group), and with no other test beside it
# (it needs every test thread), so the sweeps of the same binary, which
# keep every core busy for a minute, are not what it measures. (This
# override stands before the `fmt_property` one: the first that matches
# a test decides a setting.)
[[profile.default.overrides]]
filter = 'binary(=heavy) & (test(/^lexer_scaling::/) | test(/^repl_paste::/) | test(/^lsp_workspace_perf::/))'
test-group = 'timing'
threads-required = 'num-test-threads'

# The formatter's property runs (tests/frontend/fmt_property/mod.rs)
# format thousands of inputs on two threads each.
[[profile.default.overrides]]
filter = 'test(fmt_property)'
threads-required = 2
