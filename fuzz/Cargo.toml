[package]
name = "silt-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.silt]
path = ".."
default-features = false
# The readers of HTTP requests and responses are the `http` feature's,
# the server of the editor's messages the `lsp` feature's; the invariants
# the targets assert are the test API's (`test-hooks`).
features = ["http", "lsp", "test-hooks"]

# Disable workspace auto-discovery
[workspace]

[[bin]]
name = "fuzz_lexer"
path = "fuzz_targets/fuzz_lexer.rs"
doc = false

[[bin]]
name = "fuzz_parser"
path = "fuzz_targets/fuzz_parser.rs"
doc = false

[[bin]]
name = "fuzz_formatter"
path = "fuzz_targets/fuzz_formatter.rs"
doc = false

[[bin]]
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"
doc = false

[[bin]]
name = "fuzz_typechecker"
path = "fuzz_targets/fuzz_typechecker.rs"
doc = false

[[bin]]
name = "fuzz_compiler"
path = "fuzz_targets/fuzz_compiler.rs"
doc = false

[[bin]]
name = "fuzz_http_request"
path = "fuzz_targets/fuzz_http_request.rs"
doc = false

[[bin]]
name = "fuzz_run"
path = "fuzz_targets/fuzz_run.rs"
doc = false

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
doc = false

[[bin]]
name = "fuzz_package_files"
path = "fuzz_targets/fuzz_package_files.rs"
doc = false

[[bin]]
name = "fuzz_csv"
path = "fuzz_targets/fuzz_csv.rs"
doc = false

[[bin]]
name = "fuzz_http_response"
path = "fuzz_targets/fuzz_http_response.rs"
doc = false

[[bin]]
name = "fuzz_lsp_messages"
path = "fuzz_targets/fuzz_lsp_messages.rs"
doc = false
